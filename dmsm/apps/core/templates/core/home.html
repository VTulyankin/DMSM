{% extends "base.html" %}
{% load static %}

{% block title %}Главная - DMSM{% endblock %}

{% block extra_head %}
<!-- Include D3.js -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<!-- Include custom graph CSS -->
<link rel="stylesheet" href="{% static 'core/css/graph.css' %}">
{% endblock %}

{% block content %}
<div class="relative w-full overflow-hidden bg-white rounded-lg shadow mt-4">
    <!-- Dynamic Header -->
    <div class="absolute top-0 left-0 w-full p-4 z-10 pointer-events-none flex justify-between items-start">
        <div></div>
        <div class="text-right pointer-events-auto">
            <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">Онлайн</p>
            <p id="current-online-count" class="text-4xl font-black text-green-500 drop-shadow-sm transition-colors cursor-pointer hover:text-green-400" title="Вернуться к текущему времени">0</p>
        </div>
    </div>

    <!-- Graph Container -->
    <div id="graph-container" class="relative w-full h-80 sm:h-96 cursor-crosshair"></div>

    <!-- Floating Tooltip -->
    <div id="graph-tooltip" class="absolute hidden pointer-events-none z-20 flex flex-col items-center">
        <div class="bg-white text-gray-800 px-3 py-1.5 rounded-lg shadow-md text-lg font-bold border border-gray-200 mb-1">
            <span id="tooltip-value">0</span>
        </div>
        <!-- Dot on the line -->
        <div class="w-3 h-3 bg-white rounded-full shadow-[0_0_8px_rgba(255,255,255,0.8)] border-2 border-green-500 transition-colors" id="tooltip-dot"></div>
    </div>
</div>

<!-- Players List Section -->
<div class="mt-8 bg-white p-6 rounded-lg shadow-md border border-gray-100">
    <h2 id="players-list-title" class="text-xl font-bold text-gray-800 mb-4 flex items-center">
        <svg class="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        Игроки онлайн
    </h2>
    <div id="players-list-container" class="text-gray-600">
        <p class="italic text-sm text-gray-400">Кликните по графику, чтобы увидеть список игроков.</p>
    </div>
</div>

<!-- URLs for JS -->
<script>
    window.API_ONLINE_EVENTS = "{% url 'api:api_online_events' %}";
    window.API_PLAYERS_AT_TIME = "{% url 'api:api_players_at_time' %}";
</script>

<!-- Include custom graph JS -->
<script src="{% static 'core/js/graph.js' %}?v={% now 'U' %}"></script>
{% endblock %}
