{% extends "auth_base.html" %}

{% block title %}Вход - DMSM{% endblock %}

{% block auth_content %}
<h2 class="text-2xl font-bold mb-4 text-center">Вход</h2>

<form method="post" action="" class="auth-form">
    {% csrf_token %}
    

    
    <div class="mb-6">
        {{ form.as_p }}
    </div>

    <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2.5 px-4 rounded-lg transition-colors shadow-sm mb-3">
        Войти
    </button>
    
    {% if can_reset %}
    <a href="{% url 'users:reset_password' %}?nickname={{ nickname }}" class="block w-full text-center border-2 border-blue-500 text-blue-500 hover:bg-blue-50 font-medium py-2 px-4 rounded-lg transition-colors">
        Сбросить пароль
    </a>
    {% endif %}
</form>

<p class="mt-6 text-center text-gray-600">
    Нет аккаунта? <a href="{% url 'users:register' %}" class="text-blue-500">Зарегистрироваться</a>
</p>
{% endblock %}
