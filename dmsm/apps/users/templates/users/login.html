{% extends "auth_base.html" %}

{% block title %}Вход - DMSM{% endblock %}

{% block auth_content %}
<h2 class="text-2xl font-bold mb-4 text-center">Вход</h2>

<form method="post" action="">
    {% csrf_token %}
    
    <div class="mb-4">
        {{ form.as_p }}
    </div>

    <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded mb-2">
        Войти
    </button>
    
    {% if can_reset %}
    <a href="{% url 'users:reset_password' %}?nickname={{ nickname }}" class="block w-full text-center border border-blue-500 text-blue-500 p-2 rounded">
        Сбросить пароль
    </a>
    {% endif %}
</form>

<p class="mt-4 text-center">
    Нет аккаунта? <a href="{% url 'users:register' %}" class="text-blue-500">Зарегистрироваться</a>
</p>
{% endblock %}
