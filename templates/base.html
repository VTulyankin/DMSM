<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DMSM{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
    <!-- Navbar -->
    <nav class="p-4 bg-white shadow mb-4">
        <div class="container mx-auto flex justify-between">
            <a href="/" class="font-bold text-xl">DMSM</a>
            <div>
                {% if request.user.is_authenticated %}
                    <a href="{% url 'users:profile' request.user.username %}" class="mr-4">Профиль</a>
                    <form action="{% url 'users:logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'users:login' %}" class="mr-4">Войти</a>
                    <a href="{% url 'users:register' %}">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Messages -->
    <div class="container mx-auto px-4">
        {% if messages %}
            {% for message in messages %}
                <div class="p-4 mb-4 border rounded {% if message.tags == 'error' %}bg-red-100 border-red-400 text-red-700{% else %}bg-green-100 border-green-400 text-green-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- Main Content -->
    <main class="container mx-auto px-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
